<script>

const RELEASE_TITLE='practice vol001';
const SPINE_TITLE='practice volume 1';
const defaults={
	seed:.588,
	palette:.262,
	variety:.727,
	intensity:.624,
	rolloff:.385,
	zoom:.055,
	form:.24,
	label:.152,
	backdropHue:282,
	backdropSaturation:17,
	backdropLightness:24
};
let state={...defaults};
let assets={};
const canvas=document.getElementById('art'),
      ctx=canvas.getContext('2d');
// A phone doesn't need a 1200px live preview. Exports retain their original resolution.
const mobilePreview=window.matchMedia('(max-width: 800px) and (pointer: coarse)').matches;
const previewSize=mobilePreview?600:1200;
canvas.width=canvas.height=previewSize;
const controls=[
		['seed','ROTATIONS'],
		['palette','PALETTE'],
		['variety','COMPLEXITY'],
		['intensity','INTENSITY'],
		['rolloff','ROLL OFF'],
		['zoom','ZOOM'],
		['form','FORM'],
		['label','TYPE'],
        ['backdropHue','BG HUE'],
        ['backdropSaturation','BG SAT'],
        ['backdropLightness','BG LEVEL']
	];
const holder=document.getElementById('sliders');
const backdropControls=new
Set(['backdropHue','backdropSaturation','backdropLightness']);
const controlMaximum =key => key==='backdropHue'?360:backdropControls.has(key)?100:1;
const controlStep    =key => backdropControls.has(key)?1:.001;
const controlDisplay =key => backdropControls.has(key)?String(Math.round(state[key])):state[key].toFixed(3);
for(const [key,name] of controls){
	const d=document.createElement('div');
	d.className='field';
	d.innerHTML=`<label>${name}
		<output id="v-${key}">${controlDisplay(key)}
		</output></label><input id="s-${key}"
		type="range"
		min="0"
		max="${controlMaximum(key)}"
		step="${controlStep(key)}"
		value="${state[key]}">`;
	holder.append(d);
	d.querySelector('input').addEventListener('input',e=>{state[key]=+e.target.value;
	d.querySelector('output').textContent=controlDisplay(key);scheduleDraw()});
	d.querySelector('input').addEventListener('change',()=>scheduleDraw(true));
	}
// Same-origin image assets for the hosted version.
// Open over HTTPS (or a local HTTP server), not file://, to allow canvas exports.
const files={
			li:'images/li-primitive.png',
			famli:'images/famli-wordmark.png',
			vertical:'images/famli-vertical-wordmark.png',
			floss:'images/floss-daily-logo.png',
            labelStrip:'images/cassette_label_STRIP.png',
            labelBig:'images/cassette_label_BIG.png'
			};
for(const [key,url] of Object.entries(files)){
	const im=new Image();
	im.onload=()=>{assets[key]=im;
	scheduleDraw()};
	im.src=url
	}

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));

function hash(x,y,s){
	let t=Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453123;
	return t-Math.floor(t)
	}

function smooth(t){
	return t*t*(3-2*t)
	}

function noise(x,y,s){
	let ix=Math.floor(x),iy=Math.floor(y),
	fx=smooth(x-ix),fy=smooth(y-iy);
	let a=hash(ix,iy,s),
	b=hash(ix+1,iy,s),
	c=hash(ix,iy+1,s),
	d=hash(ix+1,iy+1,s);
	return (a+(b-a)*fx)*(1-fy)+(c+(d-c)*fx)*fy}

// Colour architecture: col_palette (RGB palette) and col_dist (greyscale
// lookup coordinate) are independent, as in the original TouchDesigner patch.
// This uses deterministic smooth value noise, not TD's GPU Perlin 4D kernel.
function paletteRGB(t){
    const period=0.25+state.variety*12;
    const seed=Math.floor(state.palette*999);
    const exponent=Math.max(0.04,4*state.rolloff);
    const amplitude=2*state.intensity;
    const offset=.453;
    return [0,1,2].map(channel=>{
        // Independent, correlated colour channels from the same seeded field.
        const n=noise(t*period+channel*11.73,channel*3.17,seed+channel*53);
        const signed=(n-.5)*2;
        const shaped=Math.sign(signed)*Math.pow(Math.abs(signed),exponent);
        return clamp(offset+amplitude*shaped*.5);
    });
}
function distribution(x,y){
    // FORM: seed of col_dist. ZOOM: period of col_dist.
    // TD's exact period-to-image coordinate mapping requires calibration.
    const seed=Math.floor(state.form*999);
    const effectiveZoom=0.10+state.zoom*3.0; // 0..1 UI maps to 0.10..3.10
    const period=Math.max(.005,.01+effectiveZoom*.42);
    const n=noise(x*period,y*period,seed+1709);
    const signed=(n-.5)*2;
    return clamp(.254+1.03*Math.sign(signed)*Math.pow(Math.abs(signed),1.15)*.5);
}
function backdropColor(){return `hsl(${state.backdropHue} ${state.backdropSaturation}% ${state.backdropLightness}%)`;}
function cssRGB(rgb){return 'rgb('+rgb.map(v=>Math.round(clamp(v)*255)).join(',')+')'}
function labelRGB(){
    // crop2 -> constant9: divide sampled RGB by perfect grey (0.5).
    return paletteRGB(state.label).map(v=>clamp(v/.5));
}

function drawImageContain(c,img,x,y,w,h){
	if(!img)return;let scale=Math.min(w/img.width,h/img.height);
	let iw=img.width*scale,ih=img.height*scale;
	c.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih)
	}

function label(c,text,x,y,size=25,align='left'){
	c.font=`${size}px 'Lucida Console',Monaco,monospace`;
	c.textAlign=align;
	c.fillStyle='#ffffff';
	c.fillText(text,x,y)
	}

function rotateLabel(c,text,x,y,angle,size=23){
	c.save();c.translate(x,y);
	c.rotate(angle);
	label(c,text,0,0,size);
	c.restore()
	}

// Preview-only caches. High-resolution PNG/PDF exports still render afresh.
const previewPattern=document.createElement('canvas');
previewPattern.width=previewPattern.height=previewSize;
const previewTile=document.createElement('canvas');
previewTile.width=previewTile.height=120;
// Pre-tinted glyph atlas: 128 palette samples, built once per palette change.
// This avoids ~800 destination-in masks on every preview regeneration.
const glyphBins=128, glyphCell=120, glyphColumns=16;
const glyphAtlas=document.createElement('canvas');
glyphAtlas.width=glyphColumns*glyphCell;
glyphAtlas.height=Math.ceil(glyphBins/glyphColumns)*glyphCell;
const glyphAtlasCtx=glyphAtlas.getContext('2d');
let glyphAtlasKey=null;
function ensureGlyphAtlas(shape){
    const key=[state.palette,state.variety,state.intensity,state.rolloff,shape].join('|');
    if(glyphAtlasKey===key)return;
    glyphAtlasCtx.setTransform(1,0,0,1,0,0);
    glyphAtlasCtx.globalCompositeOperation='source-over';
    glyphAtlasCtx.clearRect(0,0,glyphAtlas.width,glyphAtlas.height);
    for(let i=0;i<glyphBins;i++){
        const x=(i%glyphColumns)*glyphCell;
        const y=Math.floor(i/glyphColumns)*glyphCell;
        const tileCtx=previewTile.getContext('2d');
        tileCtx.clearRect(0,0,glyphCell,glyphCell);
        tileCtx.fillStyle=cssRGB(paletteRGB(i/(glyphBins-1)));
        tileCtx.fillRect(0,0,glyphCell,glyphCell);
        tileCtx.globalCompositeOperation='destination-in';
        tileCtx.drawImage(shape,0,0,glyphCell,glyphCell);
        tileCtx.globalCompositeOperation='source-over';
        glyphAtlasCtx.drawImage(previewTile,x,y);
    }
    glyphAtlasKey=key;
}
const previewOverlay=document.createElement('canvas');
previewOverlay.width=previewOverlay.height=previewSize;
const previewAlpha=document.createElement('canvas');
previewAlpha.width=previewAlpha.height=previewSize;
let patternCacheKey=null;
let drawQueued=false;
let lastPreviewDraw=0;
let forcePreviewDraw=false;
const previewInterval=mobilePreview?110:0;
function scheduleDraw(force=false){
    if(force) forcePreviewDraw=true;
    if(drawQueued)return;
    drawQueued=true;
    requestAnimationFrame(function tick(now){
        if(!forcePreviewDraw && now-lastPreviewDraw<previewInterval){
            requestAnimationFrame(tick);
            return;
        }
        drawQueued=false;
        forcePreviewDraw=false;
        lastPreviewDraw=now;
        draw();
    });
}
function render(c,size,patternOnly=false,duplex='long'){
	const S=size/1200;
	c.save();
	c.setTransform(S,0,0,S,0,0);
	c.fillStyle=backdropColor();
	c.fillRect(0,0,1200,1200);
	const tile=43,cols=Math.ceil(1200/tile),rows=Math.ceil(1200/tile);
	const seed=Math.floor(state.seed*9999);
	const freq=1.4; // Rotation field fixed at the old Variety minimum.
	// Rotation is independent of all palette and distribution controls.
	const shape=assets.li;

	// One continuous field across all three J-card panels.

    const isPreview=(c===ctx && size===previewSize && !patternOnly);
    const patternKey=[state.seed,state.palette,state.variety,state.intensity,state.rolloff,state.zoom,state.form,!!shape].join('|');
    if(isPreview){
        if(patternCacheKey!==patternKey){
            const pc=previewPattern.getContext('2d');
            pc.setTransform(1,0,0,1,0,0);
            pc.clearRect(0,0,previewSize,previewSize);
            pc.setTransform(previewSize/1200,0,0,previewSize/1200,0,0);
            drawPattern(pc);
            patternCacheKey=patternKey;
        }
        c.drawImage(previewPattern,0,0,1200,1200);
    }else{
        drawPattern(c);
    }
    function drawPattern(target){
    if(shape){
        const colored=previewTile, cc=colored.getContext('2d');
        // Preview-only approximation: sample the continuous palette into an atlas.
        // Full-resolution PNG/PDF exports retain the exact original per-glyph colours.
        if(isPreview)ensureGlyphAtlas(shape);
        const liSize=tile*1.05;
        for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
            const n=noise(x/freq,y/freq,seed);
            const q=noise(x/.55,y/.55,seed+73);
            const orientation=Math.floor(clamp(n*.62+q*.38)*4);
            const t=distribution(x,y);
            target.save();
            target.translate(x*tile+tile/2,y*tile+tile/2);
            target.rotate(orientation*Math.PI/2);
            if(isPreview){
                const bin=Math.round(t*(glyphBins-1));
                const sx=(bin%glyphColumns)*glyphCell;
                const sy=Math.floor(bin/glyphColumns)*glyphCell;
                target.drawImage(glyphAtlas,sx,sy,glyphCell,glyphCell,-liSize/2,-liSize/2,liSize,liSize);
            }else{
                cc.clearRect(0,0,120,120);
                cc.fillStyle=cssRGB(paletteRGB(t));
                cc.fillRect(0,0,120,120);
                cc.globalCompositeOperation='destination-in';
                cc.drawImage(shape,0,0,120,120);
                cc.globalCompositeOperation='source-over';
                target.drawImage(colored,-liSize/2,-liSize/2,liSize,liSize);
            }
            target.restore();
        }
    }

    }

    if(patternOnly){
        // Inside of the J-card: an explanatory panel on the wide front section.
        // The underlying generative artwork remains visible elsewhere.
		const bx = duplex === 'long' ? 80 : 535;
		const by = 225, bw = 585, bh = 510;
        c.fillStyle=backdropColor();
        c.beginPath();
        c.roundRect(bx,by,bw,bh,24);
        c.fill();

        const ink=cssRGB(labelRGB());
        c.fillStyle=ink;
        c.textAlign='left';
        c.textBaseline='alphabetic';
        c.font="bold 32px 'Lucida Console',Monaco,monospace";
        c.fillText('ABOUT THESE RECORDINGS',bx+30,by+65,bw-60);

        const lines=[
            'Every  piece  on  this cassette',
            'is taken from a live improvised',
            'performance.',
            '',
            'The six-digit code at the start',
            'of each track title is the date',
            'of its original session.',
            '',
            'Find  the video of that session',
            'using  its  date  code  in  the',
            'practice  archive:',
            '',
            'famli.dev >> YouTube >> practice'
        ];
        c.font="24px 'Lucida Console',Monaco,monospace";
        lines.forEach((line,i)=>c.fillText(line,bx+30,by+112+i*30,bw-60));
        c.restore();
        return;
    }

	// Layout pass: measured against the supplied 1240px reference image.
	// All coordinates are normalized to the 1200 x 1200 design surface.
	// The procedural field above is intentionally unchanged in this version.

	const ink='#ffffff', panel=backdropColor();

	c.fillStyle=panel;

	// Flap dark inset, with patterned margins left and right.

	c.beginPath();
	c.roundRect(76,58,195,1085, 25);
	c.fill();

	// Front logo's solid dark field, with no artificial panel divider lines.

	c.beginPath();
	c.roundRect(535,197,587,200, 25);
	c.fill();

    // Opaque backing panels are drawn on the artwork, NOT in the tinted overlay.
    // This keeps the panels the same dark plum as the other backing areas.
// Three independent, centred spine backing panels.
// Keep the procedural pattern visible between them.

c.fillStyle=panel;

// Floss Daily Logo
c.beginPath();
c.roundRect(315, 52, 139, 136, 25);
c.fill();

// Title
c.beginPath();
c.roundRect(350, 288, 53, 400, 15);
c.fill();

// Vertical Wordmark
c.beginPath();
c.roundRect(314, 790, 148, 355, 30);
c.fill();


    // All typography and wordmarks are first rendered as one transparent
    // greyscale overlay, then multiplied by the sampled/amplified label colour.
    const overlay=isPreview?previewOverlay:document.createElement('canvas');
    overlay.width=isPreview?previewSize:1200; overlay.height=isPreview?previewSize:1200;
    const oc=overlay.getContext('2d');
    oc.setTransform(1,0,0,1,0,0);
    oc.globalCompositeOperation='source-over';
    oc.clearRect(0,0,overlay.width,overlay.height);
    oc.setTransform(overlay.width/1200,0,0,overlay.height/1200,0,0);
    // Local alias: all following branding drawing targets the overlay.
    {
    const originalContext=c;
    c=oc;
	// Flap text: local X extends upward on the J-card; local Y offsets columns rightward.

function verticalBlock(x,y,heading,lines){
	c.save();
	c.translate(x,y);
	c.rotate(-Math.PI/2);
 	label(c,heading,0,0,29);
 	c.font="17px 'Lucida Console',Monaco,monospace";
 	c.textAlign='left';
 	c.fillStyle=ink;
 	lines.forEach((t,i)=>c.fillText(t,0,25+i*20));
 	c.restore();
	}
	verticalBlock(110,1125,'SIDE A',
		[
	 	'010826 sus vibes only',
	 	'290726 Tomas Haake stole my step sequencer',
	 	'310726 I would like to propose a toast...',
	 	'310726 owl house fly',
	 	'160726 snake charms',
	 	'020726 either side number 1',
	 	'280726 hopeless'
		]);
	verticalBlock(110,586,'SIDE B',
		[
	 	'280726 rhinosuseros',
	 	'010826 last foot in front of the next foot',
	 	'300626 sinking ship',
	 	'160726 don\'t forget to pack your space lunch',
	 	'020726 post sus clarity',
	 	'020726 escape plan // escape'
	 	]);

// Spine is approximately x=267..421 in the reference.

rotateLabel(c,SPINE_TITLE,365,302,Math.PI/2,37);

// Front: fixed brand hierarchy, all positioned relative to the reference.

if(assets.floss)drawImageContain(c,assets.floss,328,62,120,120);
if(assets.famli)drawImageContain(c,assets.famli,545,200,565,155);
label(c,'@faml_i',545,385,33);
label(c, RELEASE_TITLE,815,385,33);
if(assets.vertical)drawImageContain(c,assets.vertical,326,775,122,380);
    // Multiply the entire grayscale overlay by the one shared label colour.
    // White type takes the tint; grey logo pixels retain their tonal detail.
    const alphaMask=isPreview?previewAlpha:document.createElement('canvas');
    alphaMask.width=overlay.width;alphaMask.height=overlay.height;
    const ac=alphaMask.getContext('2d');
    ac.setTransform(1,0,0,1,0,0);
    ac.clearRect(0,0,alphaMask.width,alphaMask.height);
    ac.drawImage(overlay,0,0);
    oc.setTransform(1,0,0,1,0,0);
    oc.globalCompositeOperation='multiply';
    oc.fillStyle=cssRGB(labelRGB());
    oc.fillRect(0,0,overlay.width,overlay.height);
    oc.globalCompositeOperation='destination-in';
    // Rebuild original alpha mask to avoid tinting transparent regions.
    // The mask is retained before the multiply pass (see below).
    oc.drawImage(alphaMask,0,0);
    oc.globalCompositeOperation='source-over';
    originalContext.drawImage(overlay,0,0,1200,1200);
    c=originalContext;
    }
    c.restore();
}

function draw(){
    render(ctx,previewSize);
}

// Cassette label: 96 × 46 mm canvas, rasterized at approximately 600 dpi.
// Drawn only on demand; no extra preview or continuous background rendering.
// Text is concentrated in a central strip for compatibility with narrow labels.
// Shared label renderer: PNG export and the PDF cropping examples use identical artwork.
function renderCassetteLabel(){
    const W=2268,H=1087;
    const out=document.createElement('canvas');
    out.width=W;out.height=H;
    const c=out.getContext('2d');
    const unit=W/960; // 10 virtual units per mm
    c.setTransform(unit,0,0,unit,0,0);
    c.fillStyle=backdropColor();
    c.fillRect(0,0,960,460);

    // Render the existing exact per-glyph generative pattern, in label proportions.
    // Preserve the J-card's original 43-unit tile scale relative to 1200 design units.
    const tile=43,seed=Math.floor(state.seed*9999),freq=1.4;
    const shape=assets.li;
    if(shape){
      const tinted=document.createElement('canvas');
      tinted.width=tinted.height=120;
      const tc=tinted.getContext('2d');
      for(let y=0;y<Math.ceil(460/tile);y++)for(let x=0;x<Math.ceil(960/tile);x++){
        const n=noise(x/freq,y/freq,seed);
        const q=noise(x/.55,y/.55,seed+73);
        const orientation=Math.floor(clamp(n*.62+q*.38)*4);
        const t=distribution(x,y);
        tc.clearRect(0,0,120,120);
        tc.fillStyle=cssRGB(paletteRGB(t));
        tc.fillRect(0,0,120,120);
        tc.globalCompositeOperation='destination-in';
        tc.drawImage(shape,0,0,120,120);
        tc.globalCompositeOperation='source-over';
        c.save();
        c.translate(x*tile+tile/2,y*tile+tile/2);
        c.rotate(orientation*Math.PI/2);
        c.drawImage(tinted,-tile*1.05/2,-tile*1.05/2,tile*1.05,tile*1.05);
        c.restore();
      }
    }

    // Label strip for practice vol001
	const labelYOffset = -125;
	const logoXOffset = 12;

    const t_stripX=563, t_stripY=207, t_stripW=450, t_stripH=46;
    c.fillStyle=backdropColor();
    c.beginPath();
    c.roundRect(t_stripX, t_stripY+labelYOffset, t_stripW, t_stripH, 12);
    c.fill();

    // Label strip for FamLi wordmark
    const f_stripX=47, f_stripY=191, f_stripW=268, f_stripH=78;
    c.fillStyle=backdropColor();
    c.beginPath();
    c.roundRect(f_stripX+logoXOffset, f_stripY+labelYOffset, f_stripW, f_stripH, 12);
    c.fill();

    const ink=cssRGB(labelRGB());
    c.fillStyle=ink;
    c.textBaseline='middle';
    if(assets.famli){
      // Preserve wordmark aspect ratio and original transparency.
      const im=assets.famli;
      const maxW=250,maxH=65;
      const scale=Math.min(maxW/im.width,maxH/im.height);
      const w=im.width*scale,h=im.height*scale;
      const mask=document.createElement('canvas');
      mask.width=Math.ceil(w*unit);mask.height=Math.ceil(h*unit);
      const mc=mask.getContext('2d');
      mc.drawImage(im,0,0,mask.width,mask.height);
      mc.globalCompositeOperation='source-in';
      mc.fillStyle=ink;
      mc.fillRect(0,0,mask.width,mask.height);
      c.drawImage(mask,55+logoXOffset,230-h/2+labelYOffset,w,h);
    }else{
      c.font='bold 52px monospace';
      c.textAlign='left';
      c.fillText('FamLi',55,230);
    }
    c.font="37px 'Lucida Console',Monaco,monospace";
    c.textAlign='right';
    c.fillText(RELEASE_TITLE,905,230+labelYOffset,490);

    return out;
}

// Apply the supplied transparent label template as an alpha mask.
// A white backing makes the holes and cut edges obvious on the PDF page.
function renderLabelExample(labelCanvas,mask){
  const W=960,H=460;
  const masked=document.createElement('canvas');masked.width=W;masked.height=H;
  const m=masked.getContext('2d');
  m.drawImage(labelCanvas,0,0,W,H);
  m.globalCompositeOperation='destination-in';
  m.drawImage(mask,0,0,W,H);
  m.globalCompositeOperation='source-over';
  const out=document.createElement('canvas');out.width=W;out.height=H;
  const c=out.getContext('2d');
  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);
  c.drawImage(masked,0,0);
  return out;
}

// Standalone two-page PDF writer: JPEG artwork embedded as PDF image XObjects.
// No network access, external PDF libraries or browser print scaling required.

const PDF_MM=72/25.4;
function pdfBytesFromCanvas(can,quality=.95){
  const data=can.toDataURL('image/jpeg',quality).split(',')[1];
  const raw=atob(data),bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  return bytes;
}
function buildPrintPDF(){
  if(Object.keys(files).some(k=>!assets[k])){alert('Artwork assets are still loading. Try again in a moment.');return;}
  const paper=document.getElementById('paper').value;
  const duplex=document.getElementById('duplex').value;
  const guides=document.getElementById('guides').checked;
  const pageW=paper==='a4'?210:215.9,pageH=paper==='a4'?297:279.4;
  const artW=101.1682,artH=101.6;
  const x=(pageW-artW)/2;
  // Instructions occupy the upper half; artwork occupies the lower half.
  const y=pageH*.62;
  const yReverse=duplex==='short'?pageH-y-artH:y;
  const scale=2; // 2400px source raster, approximately 600 dpi at printed size.
  const front=document.createElement('canvas');front.width=1200*scale;front.height=1200*scale;
  render(front.getContext('2d'),front.width,false);
  const back=document.createElement('canvas');back.width=1200*scale;back.height=1200*scale;
  render(back.getContext('2d'),back.width,true,duplex);
  const frontJpg=pdfBytesFromCanvas(front),backJpg=pdfBytesFromCanvas(back);
  // Both examples are derived from the same generative state as the J-card.
  const labelArt=renderCassetteLabel();
  const bigExample=renderLabelExample(labelArt,assets.labelBig);
  const stripExample=renderLabelExample(labelArt,assets.labelStrip);
  const bigJpg=pdfBytesFromCanvas(bigExample,.92);
  const stripJpg=pdfBytesFromCanvas(stripExample,.92);
   // Print-only charcoal wordmark, sourced from the same brand asset as the artwork.
   // An opaque white background avoids transparency/soft-mask requirements in PDF 1.4.
   const logoCanvas=document.createElement('canvas');
   logoCanvas.width=1100;logoCanvas.height=300;
   const lc=logoCanvas.getContext('2d');
   lc.fillStyle='#ffffff';lc.fillRect(0,0,1100,300);
   const wordmark=assets.famli;
   if(wordmark){
     const scale=Math.min(1040/wordmark.width,250/wordmark.height);
     const w=wordmark.width*scale,h=wordmark.height*scale;
     const mask=document.createElement('canvas');mask.width=1100;mask.height=300;
     const mc=mask.getContext('2d');
     mc.drawImage(wordmark,30,25,w,h);
     mc.globalCompositeOperation='source-in';
     mc.fillStyle='#222222';mc.fillRect(0,0,1100,300);
     lc.drawImage(mask,0,0);
   }
   const logoJpg=pdfBytesFromCanvas(logoCanvas,.98);
  const objects=[];
  const enc=new TextEncoder();
  const ascii=s=>enc.encode(s);
  function concat(parts){let len=parts.reduce((a,p)=>a+p.length,0),out=new Uint8Array(len),at=0;for(const p of parts){out.set(p,at);at+=p.length;}return out;}
  function add(content){objects.push(typeof content==='string'?ascii(content):content);return objects.length;}
  function imageObj(bytes,w,h){return add(concat([ascii(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`),bytes,ascii('\nendstream')]));}
  const image1=imageObj(frontJpg,front.width,front.height),image2=imageObj(backJpg,back.width,back.height);
  const imageBig=imageObj(bigJpg,bigExample.width,bigExample.height);
  const imageStrip=imageObj(stripJpg,stripExample.width,stripExample.height);
   const imageLogo=imageObj(logoJpg,logoCanvas.width,logoCanvas.height);
  const font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
  const bold=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
  const mono=add('<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>');
  const esc=s=>s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  const mm=v=>(v*PDF_MM).toFixed(3);
  function lineText(text,x,top,pt=9,isBold=false){return `BT /${isBold?'FB':'F'} ${pt} Tf 1 0 0 1 ${mm(x)} ${mm(pageH-top)} Tm (${esc(text)}) Tj ET\n`;}
  // Record the exact slider state used for this exported edition.
  // Values are captured when the PDF is generated, including manual adjustments.
  function parameterLegend(){
    const values=controls.map(([key,name])=>[
      name,
      backdropControls.has(key) ? String(Math.round(state[key])) : state[key].toFixed(3)
    ]);
    const text=(str,x,top,pt=7,font='FM')=>
      `BT /${font} ${pt} Tf 1 0 0 1 ${mm(x)} ${mm(pageH-top)} Tm (${esc(str)}) Tj ET\n`;
    let out='0 0 0 rg\n';
    out+=text('GENERATIVE PARAMETERS',164,55,8,'FB');
    out+='0.35 w 0.65 0.65 0.65 RG\n';
    out+=`${mm(164)} ${mm(pageH-58)} m ${mm(pageW-14)} ${mm(pageH-58)} l S\n`;
    out+='0 0 0 rg\n';
    values.forEach(([name,value],i)=>{
      const top=65+i*7;
      out+=text(name,164,top,7);
      // Courier is monospaced: right-align against a fixed column.
      const right=pageW-15;
      const charWidth=7*0.6/PDF_MM;
      out+=text(value,right-value.length*charWidth,top,7);
    });
    // Project URL below the parameter list, within the right-hand column.
    out+='0.35 w 0.65 0.65 0.65 RG\n';
    out+=`${mm(164)} ${mm(pageH-145)} m ${mm(pageW-14)} ${mm(pageH-145)} l S\n`;
    out+='0.22 0.22 0.22 rg\n';
    out+=text('famli.dev/jcard_vol001',164,152,6,'FM');
    return out;
  }
  function rules(cx,cy,includeFold,mirrorFold=false){
    if(!guides)return '';
    const L=cx,R=cx+artW,T=cy,B=cy+artH,g=3.5,l=3;
    let s='0.35 w 0.28 0.28 0.28 RG\n';
    const seg=(x1,y1,x2,y2)=>`${mm(x1)} ${mm(pageH-y1)} m ${mm(x2)} ${mm(pageH-y2)} l S\n`;
    for(const [xx,dir] of [[L,-1],[R,1]])for(const [yy,ydir] of [[T,-1],[B,1]]){
      s+=seg(xx+dir*g,yy,xx+dir*(g+l),yy);
      s+=seg(xx,yy+ydir*g,xx,yy+ydir*(g+l));
    }
    if(includeFold){
      // Strong, visible fold ticks OUTSIDE the image, on BOTH edges.
      // Fold locations measured from the left edge: 25.40 mm and 38.10 mm.
      // On the reverse side, long-edge duplex mirrors their X positions.
      const foldOffsets=mirrorFold?[artW-25.4,artW-38.1]:[25.4,38.1];
      s+='0.9 w 0.12 0.12 0.12 RG\n';
      for(const offset of foldOffsets){
        const fx=L+offset;
        s+=seg(fx,T-8,fx,T-1.2);
        s+=seg(fx,B+1.2,fx,B+8);
      }
    }
    return s;
  }
  function artCmd(img,x0,y0){return `q ${mm(artW)} 0 0 ${mm(artH)} ${mm(x0)} ${mm(pageH-y0-artH)} cm /${img} Do Q\n`;}
   let frontCmd='0 0 0 rg\n';
   // Brand-first editorial hierarchy: logo, title, subtitle, then instructions.
   // The logo is rendered in charcoal on white for economical printing.
   frontCmd+=`q ${mm(54)} 0 0 ${mm(14.73)} ${mm(17)} ${mm(pageH-14-14.73)} cm /ImLogo Do Q\n`;
   frontCmd+=lineText('J-CARD PRINT GUIDE',18,37,13,true);
   frontCmd+=lineText('Two-sided cassette J-card  |  '+(paper==='a4'?'A4':'US Letter')+'  |  1:1 actual size',18,45,8.5);
   frontCmd+=lineText('01   PRINT',18,59,10,true);
   frontCmd+=lineText('Print BOTH pages at Actual Size / 100%. Disable Fit to Page.',18,66,8.5);
   frontCmd+=lineText('Use duplex printing: flip on '+(duplex==='long'?'LONG':'SHORT')+' edge. Keep both pages upright.',18,72,8.5);
   frontCmd+=lineText('02   PAPER',18,84,10,true);
   frontCmd+=lineText('Try matte 160-200 gsm card stock, if supported by your printer.',18,91,8.5);
   frontCmd+=lineText('For inkjet printing, choose the correct paper type / quality setting.',18,97,8.5);
   frontCmd+=lineText('03   CUT + FOLD',18,109,10,true);
   frontCmd+=lineText('Trim to the artwork boundary. Crop marks sit OUTSIDE the cut.',18,116,8.5);
   frontCmd+=lineText('Score gently at both fold ticks, then fold around the cassette case.',18,122,8.5);
   frontCmd+=lineText('04   CHECK ALIGNMENT',18,134,10,true);
   frontCmd+=lineText('First test on ordinary paper. Hold to light to inspect registration.',18,141,8.5);
   frontCmd+=lineText('Home duplex printers can shift the reverse by a few millimetres.',18,147,8.5);
   frontCmd+=lineText('ARTWORK: 101.17 x 101.60 mm  /  FOLD AT 25.40 + 12.70 mm',18,158,7.5,true);
  frontCmd+=parameterLegend();
  frontCmd+=artCmd('Im1',x,y)+rules(x,y,true);
  // Page 2's open half changes with the chosen duplex flip orientation.
  // Keep the guide clear of the actual-size J-card and all trim/fold ticks.
  const guideTop=duplex==='long'?18:125;
  const exampleW=79,exampleH=exampleW*460/960;
  const exampleLeft=18,exampleRight=pageW-18-exampleW;
  let backCmd=artCmd('Im2',x,yReverse)+rules(x,yReverse,true,duplex==='long');
  backCmd+='0 0 0 rg\n';
  backCmd+=lineText('CASSETTE LABEL / CROPPING GUIDE',18,guideTop,13,true);
  backCmd+=lineText('One generated label, two common sticker formats.',18,guideTop+8,9);
  backCmd+=lineText('FULL-FACE LABEL',exampleLeft,guideTop+18,8,true);
  backCmd+=lineText('NARROW STRIP',exampleRight,guideTop+18,8,true);
  backCmd+=artCmdExample('ImBig',exampleLeft,guideTop+22,exampleW,exampleH);
  backCmd+=artCmdExample('ImStrip',exampleRight,guideTop+22,exampleW,exampleH);
  backCmd+=lineText('Your label stock determines the final crop and alignment.',18,guideTop+70,9);
  backCmd+=lineText('Use the downloaded label PNG with your sticker template.',18,guideTop+77,9);
  backCmd+=lineText('Position and scale as needed; keep the title and logo visible.',18,guideTop+84,9);
  function artCmdExample(img,x0,y0,w,h){return `q ${mm(w)} 0 0 ${mm(h)} ${mm(x0)} ${mm(pageH-y0-h)} cm /${img} Do Q\n`; }
  function streamObj(s){
  	const b=ascii(s);
  	return add(
  			concat([
  				ascii(`<< /Length ${b.length} >>\nstream\n`),
  		   		b,
  		   		ascii('\nendstream')
  		   	])
  		);
  	}

  const content1 =streamObj(frontCmd),content2=streamObj(backCmd);
  const pagesId	 =objects.length+1;
  const page1 	 =pagesId+1,page2=pagesId+2,catalogId=pagesId+3;

  add(`<< /Type /Pages /Kids [${page1} 0 R ${page2} 0 R] /Count 2 >>`);

  for(const [im,content] of [[image1,content1],[image2,content2]])
    add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${mm(pageW)} ${mm(pageH)}] /Resources << /XObject << /${im===image1?'Im1':'Im2'} ${im} 0 R /ImBig ${imageBig} 0 R /ImStrip ${imageStrip} 0 R /ImLogo ${imageLogo} 0 R >> /Font << /F ${font} 0 R /FB ${bold} 0 R /FM ${mono} 0 R >> >> /Contents ${content} 0 R >>`);
  add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
  const chunks	=[ascii('%PDF-1.4\n%FAMLI\n')],
  		offsets =[0];let 
  		pos 	=chunks[0].length;
  for(let i=0;i<objects.length;i++){
    offsets.push(pos);
    const block=concat([ascii(`${i+1} 0 obj\n`),objects[i],ascii('\nendobj\n')]);
    chunks.push(block);pos+=block.length;
  }
  const xref=pos;
  let trailer=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
  for(let i=1;i<offsets.length;i++)trailer+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  trailer+=`trailer\n<< /Size ${objects.length+1} /Root ${catalogId} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  chunks.push(ascii(trailer));
  const blob=new Blob(chunks,{type:'application/pdf'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='famli-jcard-print-'+paper+'-'+duplex+'.pdf';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}
const pdfButton=document.getElementById('pdf');
// Wait for all embedded artwork assets to finish decoding before export.
async function ensureAssetsReady(){
  await Promise.all(Object.entries(files).map(async ([key,url])=>{
    if(assets[key]?.complete && assets[key].naturalWidth) return;
    const img=new Image();
    img.src=url;
    await img.decode();
    assets[key]=img;
  }));
}
pdfButton.onclick=async()=>{
  const original=pdfButton.textContent;
  pdfButton.disabled=true;
  pdfButton.textContent='GENERATING PDF… PLEASE WAIT';
  try{
    // Yield to the browser so the progress label paints before expensive rendering.
    await new Promise(resolve=>setTimeout(resolve,60));

    buildPrintPDF();
    pdfButton.textContent='PDF DOWNLOAD STARTED';
  }catch(error){
    console.error('FamLi PDF export failed:',error);
    alert('PDF export failed: '+(error?.message||String(error))+'\n\nTry again, or check Edge Downloads (Ctrl+J).');
  }finally{
    setTimeout(()=>{pdfButton.disabled=false;pdfButton.textContent=original;},2500);
  }
};
