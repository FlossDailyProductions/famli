<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>FamLi — YouTube Playlists</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; padding: 32px 16px;
      display: grid; place-items: center;
      background: linear-gradient(rgba(16,16,20,.55),rgba(16,16,20,.75)),
                  var(--background-image, none) center / cover fixed no-repeat, #101014;
      color: #f3f3f5; font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      width: 100%; max-width: 520px; padding: 32px 22px 26px;
      background: #1b1b21; border: 1px solid #383840;
      border-radius: 18px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .logo { display: block; width: min(180px,65%); height: auto; margin: 0 auto 12px; }
    .youtube-label { display: flex; align-items: center; justify-content: center; gap: 9px;
      color: #e7e7eb; font-weight: 700; font-size: 17px; margin-bottom: 28px; }
    .youtube-label svg { width: 29px; height: 22px; }
    .playlists { display: grid; gap: 12px; }
    .playlist { display: block; overflow: hidden; border-radius: 13px; line-height: 0;
      border: 1px solid #4a4a55; background: #282830;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
    .playlist img { display: block; width: 100%; height: auto; aspect-ratio: 16/9;
      object-fit: cover; transition: filter .2s ease; }
    .playlist:hover, .playlist:focus-visible { transform: scale(1.015); border-color: #aaaab7;
      box-shadow: 0 8px 24px rgba(0,0,0,.35); outline-offset: 3px; }
    .playlist:hover img, .playlist:focus-visible img { filter: brightness(1.12); }
    .footer { margin: 24px 0 0; font-size: 12px; color: #858590; }
    .footer a { color: inherit; text-decoration: none; }
    .footer a:hover { color: #fff; text-decoration: underline; }
    @media (max-width: 380px) { .card { padding: 26px 16px 22px; } }
    @media (prefers-reduced-motion: reduce) { .playlist, .playlist img { transition: none; } }
  </style>
  <script>
    // Keep the same background filenames as the main landing page.
    const backgrounds = ["images/BG_1.webp", "images/BG_2.webp", "images/BG_3.webp", "images/BG_4.webp"];
    document.documentElement.style.setProperty("--background-image",
      `url("${backgrounds[Math.floor(Math.random() * backgrounds.length)]}")`);
  </script>
</head>
<body>
  <main class="card">

    <!-- Copy images/FamLi.png from your main site. -->
    <img class="logo" src="images/FamLi.png" alt="FamLi">

    <div class="youtube-label" aria-label="YouTube playlists">
      <svg viewBox="0 0 28 20" aria-hidden="true"><rect x="0" y="1" width="28" height="18" rx="5" fill="#ff0033"/><path d="M11 5.5 19 10l-8 4.5z" fill="white"/></svg>
      <span>YouTube Playlists</span>
    </div>

    <nav class="playlists" aria-label="FamLi YouTube playlists">
      <!-- Replace each REPLACE_WITH_... URL with the corresponding playlist link. -->

      <a class="playlist" href="https://www.youtube.com/playlist?list=PLInbNeb5y8HXdpRbKkRvDppl7-5c05ovW" target="_blank" rel="noopener noreferrer" aria-label="favourites playlist on YouTube" data-playlist="favourites">
        <img src="images/favourites.webp" alt="favourites" loading="lazy" width="1200" height="675">
      </a>

      <a class="playlist" href="https://www.youtube.com/playlist?list=PLInbNeb5y8HVRa-GzpwICsqxMJ-6-xjfl" target="_blank" rel="noopener noreferrer" aria-label="Practice playlist on YouTube" data-playlist="practice">
        <img src="images/practice.webp" alt="Practice" loading="lazy" width="1200" height="675">
      </a>

      <a class="playlist" href="https://www.youtube.com/playlist?list=PLInbNeb5y8HW77MmA0qv_D8ukFMNVQat5" target="_blank" rel="noopener noreferrer" aria-label="Live Highlights playlist on YouTube" data-playlist="live-highlights">
        <img src="images/live-highlights.webp" alt="Live Highlights" loading="lazy" width="1200" height="675">
      </a>

      <a class="playlist" href="https://www.youtube.com/playlist?list=PLInbNeb5y8HWlz6It3WCLVTs_vG_DolkV" target="_blank" rel="noopener noreferrer" aria-label="Live Shows playlist on YouTube" data-playlist="live-shows">
        <img src="images/live-shows.webp" alt="Live Shows" loading="lazy" width="1200" height="675">
      </a>

      <a class="playlist" href="https://www.youtube.com/playlist?list=PLInbNeb5y8HXWGNM8sc7YwYPKD7oPeHk2" target="_blank" rel="noopener noreferrer" aria-label="Mediums playlist on YouTube" data-playlist="mediums">
        <img src="images/mediums.webp" alt="Mediums" loading="lazy" width="1200" height="675">
      </a>

      <a class="playlist" href="https://www.youtube.com/playlist?list=PLInbNeb5y8HXurlaTmmbk0Mid6z3pQYMt" target="_blank" rel="noopener noreferrer" aria-label="Remixes playlist on YouTube" data-playlist="remixes">
        <img src="images/remixes.webp" alt="Remixes" loading="lazy" width="1200" height="675">
      </a>

      <a class="playlist" href="https://www.youtube.com/playlist?list=PLInbNeb5y8HV-KMpou4nIPK10FyGGm_7-" target="_blank" rel="noopener noreferrer" aria-label="Misc playlist on YouTube" data-playlist="misc">
        <img src="images/misc.webp" alt="Misc" loading="lazy" width="1200" height="675">
      </a>

    </nav>
    <p class="footer"><a href="index.html">← FamLi home</a> · <a href="https://flossdailyproductions.com">Floss Daily Productions</a></p>
  </main>
</body>
</html>
