<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>FamLi — Links</title>
  <style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100svh;
        padding: 32px 16px;
        display: grid;
        place-items: center;
        background: #101014;
        color: #f3f3f5;
        font-family: Arial, Helvetica, sans-serif;
        }

    .parallax-bg {
      position: fixed;
      inset: -20vh 0;
      z-index: -1;

      background:
        linear-gradient(
          rgba(16,16,20,0.55),
          rgba(16,16,20,0.75)
          ),
        var(--background-image, none) center / cover no-repeat,
        #101014;

      will-change: transform;
      pointer-events: none;
      }
    .card {
      width: 100%;
      max-width: 390px;
      padding: 32px 22px 26px;
      background: rgba(27, 27, 33, 0.15);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 1px solid #383840;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .logo {
      display: block;
      width: min(180px, 65%);
      height: auto;
      margin: 0 auto 12px;
    }
    h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: .04em; }
    .subtitle { margin: 0 0 28px; color: #b5b5be; font-size: 14px; line-height: 1.5; }
    .links { display: grid; gap: 12px; }
    .link {
      display: grid;
      grid-template-columns: 24px 100px;
      align-items: center;
      justify-content: center;
      column-gap: 12px;
      text-align: left;
      min-height: 58px;
      padding: 12px 16px;
      border: 1px solid #4a4a55;
      border-radius: 10px;
      background: #282830;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      transition: background .15s ease, border-color .15s ease;
    }
    .link:hover, .link:focus-visible { background: #383843; border-color: #aaaab7; }
    .link-icon { width: 24px; height: 24px; object-fit: contain; flex: 0 0 24px; }
    .footer { margin: 24px 0 0; font-size: 12px; color: #858590; }
    .footer a {
    color: inherit;
    text-decoration: none;
    }
    .footer a:hover {
    color: #ffffff;
    }
    @media (max-width: 380px) { .card { padding: 26px 16px 22px; } }
  </style>
</head>

<script>
  const backgrounds = [
    "images/BG_1.webp",
    "images/BG_2.webp",
    "images/BG_3.webp",
    "images/BG_4.webp",
  ];

  const randomIndex = Math.floor(Math.random() * backgrounds.length);
  const selectedBackground = backgrounds[randomIndex];

  document.documentElement.style.setProperty(
    "--background-image",
    `url("${selectedBackground}")`
  );
</script>

<body>
  <div class="parallax-bg" aria-hidden="true"></div>
  <main class="card">

    <!-- LOGO --> 
    <img class="logo" src="images/FamLi.png" alt="FamLi logo">

    <!-- SUBTITLE --> 
    <p class="subtitle">practice makes perfect</p>

    <nav class="links" aria-label="FamLi links">
      <!-- Duplicate or remove these example links as needed. -->
      
      <!-- LINK IN BIO -->
      <a class="link" href="https://youtu.be/c9wtnkt-J_0?si=Xd6tFjqSpEEki9AY" target="_blank" rel="noopener noreferrer">
        <img class="link-icon" src="images/Li.png" alt=""> Link in Bio
      </a>

      <!-- YOUTUBE -->
      <a class="link" href="youtube.html" target="_blank" rel="noopener noreferrer">
        <img class="link-icon" src="images/PLAY.png" alt=""> YouTube
      </a>

      <!-- SHOWREEL -->
      <a class="link" href="https://www.youtube.com/watch?v=-0avWqn8cH4" target="_blank" rel="noopener noreferrer">
      <img class="link-icon" src="images/S.png" alt=""> Showreel
      </a>

      <!-- RELEASES -->
      <a class="link" href="https://famli.bandcamp.com/" target="_blank" rel="noopener noreferrer">
      <img class="link-icon" src="images/R.png" alt=""> Releases
      </a>

      <!-- INSTAGRAM -->
      <a class="link" href="https://www.instagram.com/faml_i/" target="_blank" rel="noopener noreferrer">
        <!-- To add an icon, uncomment the next line and change the filename: -->
        <img class="link-icon" src="images/IG.png" alt=""> Instagram
      </a>

      <!-- TIKTOK -->
      <a class="link" href="https://www.tiktok.com/@faml_i" target="_blank" rel="noopener noreferrer">
        <!-- To add an icon, uncomment the next line and change the filename: -->
        <img class="link-icon" src="images/T.png" alt=""> TikTok
      </a>

      <!-- RESIDENT ADVISOR -->
      <a class="link" href="https://ra.co/dj/famli" target="_blank" rel="noopener noreferrer">
      <img class="link-icon" src="images/R.png" alt=""> RA
      </a>

    </nav>

    <p class="footer"><a href="https://flossdailyproductions.com">Floss Daily Productions</a></p>
  </main>

  <script>
    const parallaxBg = document.querySelector('.parallax-bg');
    const reducedMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    );

    let ticking = false;

    function updateParallax() {
      if (!reducedMotion.matches) {
        const scrollY = window.scrollY;
        parallaxBg.style.transform =
         `translate3d(0, ${scrollY * 0.3}px, 0)`;
      } else {
       parallaxBg.style.transform = 'none';
      }

      ticking = false;
    }

    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(updateParallax);
        ticking = true;
      }
    }, { passive: true });

    updateParallax();
  </script>
</body>
</html>
